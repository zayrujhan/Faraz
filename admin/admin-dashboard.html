<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans h-screen flex">
    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between p-6">
        <div>
            <h1 class="text-xl font-bold tracking-wider mb-8 text-blue-400">Admin Panel</h1>
            <nav class="space-y-2">
                <button onclick="switchTab('dashboard')" class="w-full text-left px-4 py-2.5 rounded-lg bg-blue-600 font-medium">Dashboard</button>
                <button onclick="switchTab('users')" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300">User Management</button>
                <button onclick="switchTab('shipments')" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300">Shipment Management</button>
                <button onclick="switchTab('sellers')" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300">Seller Oversight</button>
            </nav>
        </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="dashboard-tab" class="tab-content">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Platform Overview</h2>
            <div id="metrics-container" class="grid grid-cols-4 gap-6">
                <!-- Dynamically populated metrics -->
            </div>
        </div>
        <div id="sellers-tab" class="tab-content hidden">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Seller Override Portal</h2>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex gap-4 mb-6">
                    <input type="text" id="sellerIdInput" placeholder="Enter Seller ID..." class="border border-slate-300 px-4 py-2 rounded-lg w-80 outline-none">
                    <button onclick="fetchSellerData()" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium">Inspect Store</button>
                </div>
                <pre id="sellerOutput" class="bg-slate-50 p-4 rounded-lg text-xs text-slate-700"></pre>
            </div>
        </div>
    </main>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`${tab}-tab`).classList.remove('hidden');
        }

        async function fetchSellerData() {
            const sellerId = document.getElementById('sellerIdInput').value;
            const token = localStorage.getItem('adminToken');
            const res = await fetch(`/api/admin/seller/dashboard?seller_id=${sellerId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            document.getElementById('sellerOutput').textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
